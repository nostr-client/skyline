<link rel="stylesheet" href="https://nostr-client.github.io/theme/theme.css">
<style>
  :root {
    /* the sky palette */
    --nc-bg: #ffffff;
    --nc-surface: #ffffff;
    --nc-inset: #f1f3f5;
    --nc-ink: #0b0f14;
    --nc-soft: #42576c;
    --nc-faint: #5b7189;        /* was #7a8fa6 — 3.33:1 on white, used for real content */
    --nc-line: #d4dbe2;
    --nc-accent: #1083fe;       /* brand mark: underlines, borders, non-text */
    --nc-accent-text: #0a63c9;  /* same hue at 5.1:1 — for text and button fills */
    --nc-accent-ink: #ffffff;
    --nc-accent-soft: #e7f1ff;
    --nc-radius: 16px;
    --nc-radius-sm: 10px;
    --nc-shadow: none;
    --nc-shadow-pop: 0 8px 32px rgb(11 15 20 / 12%);
    font-size: 15px;
  }
  body { margin: 0; }
  :focus-visible { outline: 2px solid var(--nc-accent-text); outline-offset: 2px; border-radius: 6px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .offline { background: #fdeaea; color: #a33; font-size: .85rem;
    padding: .6rem 1rem; border-bottom: 1px solid #f3cfcf; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important;
      scroll-behavior: auto !important; }
  }
  .app { display: grid; grid-template-columns: 15rem 600px minmax(0, 20rem);
    justify-content: center; gap: 0 1.6rem; min-height: 100vh; }

  /* ---- left sidebar */
  .side { position: sticky; top: 0; height: 100vh; box-sizing: border-box;
    padding: .8rem .4rem .8rem 0; display: flex; flex-direction: column; gap: .2rem; }
  .logo { font-size: 1.7rem; padding: .5rem .9rem .9rem; text-decoration: none; }
  .side nav { display: flex; flex-direction: column; flex: 1; gap: .1rem; }
  .side nav button { font: inherit; font-size: 1.15rem; display: flex; align-items: center;
    gap: .9rem; padding: .6rem .9rem; border: none; background: none; color: var(--nc-ink);
    border-radius: 999px; cursor: pointer; text-align: left; }
  .side nav button:hover { background: var(--nc-inset); }
  .side nav button.active { font-weight: 700; }
  .side nav button svg { width: 1.5em; height: 1.5em; flex: none; }
  .side nav button .bal { margin-left: auto; font-size: .8rem; font-weight: 600;
    color: var(--nc-accent-text); background: var(--nc-accent-soft); border-radius: 999px;
    padding: .15em .6em; font-variant-numeric: tabular-nums; }
  /* an empty wallet shouldn't look like a notification */
  .side nav button .bal.zero { color: var(--nc-faint); background: var(--nc-inset); }
  .bottombar .hasbal { position: relative; }
  .bottombar .hasbal .bal { position: absolute; top: 0; left: 50%; transform: translateX(.35rem);
    font-size: .58rem; font-weight: 700; line-height: 1; color: var(--nc-accent-ink);
    background: var(--nc-accent-text); border-radius: 999px; padding: .2em .4em;
    font-variant-numeric: tabular-nums; }
  .side nav button.active svg { stroke-width: 2.6; }
  .newpost { font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
    background: var(--nc-accent-text); color: #fff; border: none; border-radius: 999px;
    padding: .75em 0; margin: .8rem .9rem 1rem 0; }
  .newpost:hover { filter: brightness(1.06); }
  .side .me { padding: .4rem .9rem .4rem 0; }

  /* ---- center column */
  .center { border-left: 1px solid var(--nc-line); border-right: 1px solid var(--nc-line);
    min-height: 100vh; }
  .tabs { position: sticky; top: 0; z-index: 6; display: flex;
    background: rgb(255 255 255 / 88%); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--nc-line); }
  .tabs button { font: inherit; font-size: 1rem; flex: 1; padding: 1rem 0 .8rem;
    border: none; background: none; color: var(--nc-soft); cursor: pointer; position: relative; }
  .tabs button:hover { background: var(--nc-inset); }
  .tabs button.active { color: var(--nc-ink); font-weight: 700; }
  .tabs button.active::after { content: ''; position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%); width: 3.6rem; height: 3px; border-radius: 3px 3px 0 0;
    background: var(--nc-accent); }
  .viewbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center;
    gap: .8rem; padding: .8rem 1rem;
    background: rgb(255 255 255 / 88%); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--nc-line); font-weight: 700; font-size: 1.1rem; }
  .viewbar .back { font: inherit; border: none; background: none; cursor: pointer;
    font-size: 1.2rem; color: var(--nc-ink); padding: 0 .2rem; border-radius: 999px; }
  .viewbar .back:hover { background: var(--nc-inset); }
  .viewbar[hidden] { display: none; }
  .view { display: none; } .view.active { display: block; }
  .pad { padding: 1rem; }
  .prompt { display: flex; gap: .8rem; align-items: center; padding: .9rem 1rem;
    border-bottom: 1px solid var(--nc-line); cursor: text; }
  .prompt .fake { color: var(--nc-faint); flex: 1; }
  .prompt .btn { background: var(--nc-accent-text); color: #fff; font-weight: 700;
    border: none; border-radius: 999px; padding: .45em 1.2em; font-size: .95rem; }
  #composer-wrap { display: none; border-bottom: 1px solid var(--nc-line); padding: .8rem 1rem; }
  #composer-wrap.open { display: block; }
  nostr-feed[flush] { display: block; }
  .quiet { color: var(--nc-soft); padding: 2.4rem 1rem; text-align: center; }

  /* ---- right rail */
  .rail { position: sticky; top: 0; height: 100vh; box-sizing: border-box;
    padding: .8rem 0; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  .railcard { border: 1px solid var(--nc-line); border-radius: var(--nc-radius);
    padding: .9rem 1.1rem; }
  .railcard h3 { margin: 0 0 .6rem; font-size: 1rem; }
  .trend { display: block; padding: .45rem 0; text-decoration: none; }
  .trend .t { font-weight: 700; color: var(--nc-ink); }
  .trend .c { font-size: .82rem; color: var(--nc-faint); display: block; }
  .foot { font-size: .75rem; color: var(--nc-faint); padding: 0 .2rem; }
  .foot a { color: inherit; }

  /* ---- mobile */
  .bottombar { display: none; }
  @media (max-width: 1100px) { .app { grid-template-columns: 15rem minmax(0, 600px); } .rail { display: none; } }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .center { border: none; }
    .bottombar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgb(255 255 255 / 94%); backdrop-filter: blur(10px);
      border-top: 1px solid var(--nc-line); justify-content: space-around;
      /* clear the iPhone home-indicator strip */
      padding: .35rem 0 calc(.6rem + env(safe-area-inset-bottom)); }
    .bottombar button { font: inherit; border: none; background: none; color: var(--nc-ink);
      cursor: pointer; border-radius: 999px;
      /* 44px minimum touch target */
      min-width: 44px; min-height: 44px; display: grid; place-items: center; padding: .4rem .9rem; }
    .bottombar button svg { width: 1.6em; height: 1.6em; }
    .bottombar button.active { color: var(--nc-accent-text); }
    body { padding-bottom: calc(4.2rem + env(safe-area-inset-bottom)); }
  }
</style>

<nav class="bottombar" aria-label="Primary" id="bottombar">
  <button data-view="home" aria-label="Home" class="active"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>

  <button data-view="notifications" aria-label="Notifications"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>

<script type="module">
  // hardened default pool: verified events, local cache, saved relays
  await import('https://nostr-client.github.io/setup/setup.js')
  import('https://nostr-client.github.io/reactions/reactions.js')
  await import('https://nostr-client.github.io/wallet/wallet.js') // ₿ under the blue sky
  await Promise.all([
    'login/login.js', 'composer/composer.js', 'feed/feed.js', 'thread/thread.js',
    'notifications/notifications.js', 'search/search.js', 'contacts/contacts.js',
    'profile/profile.js', 'profile-editor/profile-editor.js',
  ].map((path) => import('https://nostr-client.github.io/' + path)))
  const { defaultPool } = await import('https://nostr-client.github.io/pool/pool.js')

  const $ = (id) => document.getElementById(id)
  const HEX = /^[0-9a-f]{64}$/

  // ------------------------------------------------------------- routing
  const TITLES = { search: 'Search', notifications: 'Notifications', me: 'Profile',
    wallet: 'Wallet', thread: 'Thread', person: 'Profile', tag: '' }
  const navs = [...document.querySelectorAll('#nav button'), ...document.querySelectorAll('#bottombar button')]
  let currentTab = 'home'

  function show(view, { push = true, hash = '', title } = {}) {
    for (const b of navs) {
      const on = b.dataset.view === view
      b.classList.toggle('active', on)
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current')
    }
    for (const v of document.querySelectorAll('.view')) {
      v.classList.toggle('active', v.id === 'view-' + view)
    }
    const overlay = ['thread', 'person', 'tag'].includes(view)
    $('tabs').style.display = view === 'home' ? '' : 'none'
    $('viewbar').hidden = view === 'home'
    $('back').style.visibility = overlay ? 'visible' : 'hidden'
    $('viewtitle').textContent = title ?? TITLES[view] ?? ''
    if (push) {
      // remember where we were so Back can put the reader back
      history.replaceState({ ...history.state, scrollY: scrollY }, '')
      history.pushState({}, '', hash ? '#' + hash : location.pathname)
      scrollTo(0, 0)
    } else {
      // restoring from popstate: keep the reader's place instead of jumping to top
      const y = history.state?.scrollY
      requestAnimationFrame(() => scrollTo(0, typeof y === 'number' ? y : 0))
    }
  }

  const TAB_VIEWS = ['home', 'search', 'notifications', 'wallet', 'me']
  function route(hash) {
    const [kind, value] = hash.split('/')
    if (TAB_VIEWS.includes(kind) && !value) {
      currentTab = kind
      show(kind, { push: false })
    } else if (kind === 'note' && HEX.test(value)) {
      $('thread').setAttribute('event-id', value)
      show('thread', { push: false })
    } else if (kind === 'person' && HEX.test(value)) {
      $('person-card').setAttribute('pubkey', value)
      $('person-feed').setAttribute('authors', value)
      show('person', { push: false })
    } else if (kind === 'tag' && value) {
      let label = value
      try { label = decodeURIComponent(value) } catch { /* '#tag/%' must not break routing */ }
      $('tag-feed').setAttribute('hashtag', value)
      show('tag', { push: false, title: '#' + label })
    } else {
      show(currentTab, { push: false })
    }
  }

  for (const b of navs) b.onclick = () => {
    currentTab = b.dataset.view
    show(currentTab, { hash: currentTab === 'home' ? '' : currentTab })
  }
  $('back').onclick = () => history.back()
  addEventListener('popstate', () => route(location.hash.slice(1)))

  globalThis.__nostrClientNoteUrl = (id) => location.origin + location.pathname + '#note/' + id

  document.addEventListener('nostr:note-click', (e) => {
    // focus the note that was actually clicked, so its own id lands in the URL
    // and is shareable. <nostr-thread> renders the ancestor chain above it,
    // so collapsing to the thread root here only threw away precision.
    const target = e.detail.targetId ?? e.detail.event.id
    $('thread').setAttribute('event-id', target)
    show('thread', { hash: 'note/' + target })
  })
  document.addEventListener('nostr:profile-click', (e) => {
    e.preventDefault()
    $('person-card').setAttribute('pubkey', e.detail.pubkey)
    $('person-feed').setAttribute('authors', e.detail.pubkey)
    show('person', { hash: 'person/' + e.detail.pubkey })
  })
  document.addEventListener('nostr:hashtag-click', (e) => {
    $('tag-feed').setAttribute('hashtag', e.detail.tag)
    show('tag', { hash: 'tag/' + e.detail.tag, title: '#' + e.detail.tag })
  })
  // route() on boot even without a hash, so the initial view gets its active
  // and aria-current state from the same code path as every later navigation
  route(location.hash.slice(1))

  // -------------------------------------------------- home tabs + composer
  const tabs = document.querySelectorAll('#tabs button')
  const homeFeed = $('home-feed')
  const homeEmpty = $('home-empty')
  let follows = null
  let mode = 'discover'

  async function setMode(next) {
    mode = next
    for (const t of tabs) {
      const on = t.dataset.mode === mode
      t.classList.toggle('active', on)
      t.setAttribute('aria-selected', String(on))
    }
    if (mode === 'discover') {
      homeEmpty.hidden = true; homeFeed.hidden = false
      homeFeed.removeAttribute('authors')
      return
    }
    if (!window.nostrPubkey) {
      homeEmpty.textContent = 'Sign in to see posts from people you follow.'
      homeEmpty.hidden = false; homeFeed.hidden = true
      return
    }
    if (!follows) {
      const contacts = await defaultPool().get({ kinds: [3], authors: [window.nostrPubkey] })
      follows = (contacts?.tags ?? []).filter((t) => t[0] === 'p' && HEX.test(t[1] ?? '')).map((t) => t[1])
    }
    if (follows.length) {
      homeEmpty.hidden = true; homeFeed.hidden = false
      homeFeed.setAttribute('authors', follows.slice(0, 500).join(','))
    } else {
      homeEmpty.textContent = "You're not following anyone yet — find people in Discover."
      homeEmpty.hidden = false; homeFeed.hidden = true
    }
  }
  for (const t of tabs) t.onclick = () => setMode(t.dataset.mode)
  window.addEventListener('nostr:login', () => { follows = null; refreshMe(); if (mode === 'following') setMode(mode) })
  window.addEventListener('nostr:logout', () => { follows = null; refreshMe(); if (mode === 'following') setMode(mode) })
  window.addEventListener('nostr:contacts-changed', () => { follows = null; if (mode === 'following') setMode(mode) })

  const wrap = $('composer-wrap')
  function openComposer() {
    currentTab = 'home'; show('home')
    wrap.classList.add('open')
    $('prompt').style.display = 'none'
    wrap.querySelector('nostr-composer').shadowRoot?.getElementById('text')?.focus()
  }
  $('prompt').onclick = openComposer
  $('newpost').onclick = openComposer
  document.addEventListener('nostr:quote', (e) => {
    e.preventDefault()
    openComposer()
    document.querySelector('#composer-wrap nostr-composer')?.insert?.(e.detail.text)
  })
  window.addEventListener('nostr:published', () => {
    wrap.classList.remove('open')
    $('prompt').style.display = ''
  })

  // ------------------------------------------ wallet balance in the nav
  // A rough figure, so you know roughly what you can tip without leaving the
  // feed. The exact number, and the network, live on the Wallet page.
  {
    const walletMod = await import('https://nostr-client.github.io/wallet/wallet.js')
    const { tipWallet } = walletMod
    // Components are cached independently here, so a browser can hold an older
    // wallet.js than this page expects. Degrade instead of throwing on every
    // balance update.
    const short = walletMod.formatSatsShort ??
      ((n) => (n >= 1_000_000 ? Math.round(n / 1_000_000) + 'M' : n >= 1_000 ? Math.round(n / 1_000) + 'k' : String(n)))
    const chips = [$('navbal'), $('barbal')]
    const paint = (sats) => {
      const text = short(sats)
      for (const chip of chips) {
        chip.textContent = text
        chip.title = sats.toLocaleString() + ' sats'
        chip.classList.toggle('zero', sats === 0)
        // the bottom-bar pill is a badge: an empty wallet isn't news
        chip.hidden = chip.id === 'barbal' && sats === 0
      }
    }
    const clear = () => { for (const chip of chips) chip.hidden = true }

    let inFlight = false
    async function refreshBalance() {
      if (!window.nostrPubkey) { clear(); return }
      if (inFlight) return
      inFlight = true
      try {
        const { total } = await (await tipWallet()).balance()
        if (window.nostrPubkey) paint(total)
      } catch { /* offline or rate limited — keep whatever is shown */ }
      finally { inFlight = false }
    }
    // the wallet card broadcasts its own balance; free updates while it's open
    window.addEventListener('nostr:wallet-balance', (e) => {
      if (window.nostrPubkey) paint(e.detail.total)
    })
    window.addEventListener('nostr:login', refreshBalance)
    window.addEventListener('nostr:logout', clear)
    refreshBalance()
    setInterval(refreshBalance, 60_000)
  }

  // The sidebar (and its <nostr-login>) is display:none below 800px, which left
  // phones with no way to log in at all — read-only feed, four dead tabs.
  $('me-login').append(document.createElement('nostr-login'))

  // ------------------------------------------------------------- offline
  {
    const strip = document.createElement('div')
    strip.className = 'offline'
    strip.setAttribute('role', 'status')
    strip.textContent = 'You are offline — posts and tips will fail until you reconnect.'
    strip.hidden = true
    document.querySelector('main').prepend(strip)
    const sync = () => { strip.hidden = navigator.onLine }
    addEventListener('online', sync)
    addEventListener('offline', sync)
    sync()
  }

  // ------------------------------------------------------------- profile
  function refreshMe() {
    const pad = $('me-pad')
    pad.innerHTML = ''
    if (!window.nostrPubkey) {
      const q = document.createElement('div')
      q.className = 'quiet'
      q.textContent = 'Sign in to see your profile.'
      pad.append(q)
      return
    }
    const card = document.createElement('nostr-profile')
    card.setAttribute('pubkey', window.nostrPubkey)
    const editor = document.createElement('nostr-profile-editor')
    editor.style.marginTop = '1rem'
    pad.append(card, editor)
  }
  refreshMe()

  // ------------------------------------------------------------ trending
  const STOP = new Set(['the','and','for','you','with','this','that','are','not','all','from','was','list','have'])
  // This is the global kind-1 firehose. Left unbounded it grew a tag map and a
  // per-author Set forever, and repainted the DOM every 3s whether or not the
  // top six changed — which also stole focus from anyone tabbing through it.
  const TAG_CAP = 300
  const tagAuthors = new Map() // tag -> { who: Set<pubkey>, seen: ms }
  defaultPool().subscribe([{ kinds: [1], limit: 150 }], {
    onEvent: (ev) => {
      for (const t of ev.tags) {
        if (t[0] === 't' && t[1]) {
          const tag = t[1].toLowerCase()
          if (tag.length < 3 || tag.length > 25 || STOP.has(tag)) continue
          let entry = tagAuthors.get(tag)
          if (!entry) { entry = { who: new Set(), seen: 0 }; tagAuthors.set(tag, entry) }
          if (entry.who.size < 500) entry.who.add(ev.pubkey)
          entry.seen = Date.now()
        }
      }
      if (tagAuthors.size > TAG_CAP) {
        // evict least-recently-seen tags
        const stale = [...tagAuthors.entries()].sort((a, b) => a[1].seen - b[1].seen)
        for (const [tag] of stale.slice(0, tagAuthors.size - TAG_CAP)) tagAuthors.delete(tag)
      }
    },
  })
  let lastTrend = ''
  setInterval(() => {
    // rank by unique authors so one spammer can't own Trending
    const top = [...tagAuthors.entries()].map(([tag, e]) => [tag, e.who.size])
      .filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6)
    const trends = $('trends')
    if (!top.length) {
      if (lastTrend !== 'empty') { lastTrend = 'empty'; trends.textContent = 'nothing trending yet' }
      return
    }
    const signature = top.map(([t, n]) => t + n).join('|')
    if (signature === lastTrend) return // nothing changed; don't touch the DOM
    lastTrend = signature
    trends.innerHTML = ''
    for (const [tag, count] of top) {
      const a = document.createElement('a')
      a.className = 'trend'
      a.href = '#tag/' + tag
      const t = document.createElement('span')
      t.className = 't'
      t.textContent = '#' + tag
      const c = document.createElement('span')
      c.className = 'c'
      c.textContent = count + ' people posting'
      a.append(t, c)
      a.onclick = (e) => {
        e.preventDefault()
        $('tag-feed').setAttribute('hashtag', tag)
        show('tag', { hash: 'tag/' + tag, title: '#' + tag })
      }
      trends.append(a)
    }
  }, 8000)
</script>
</body>
</html>
